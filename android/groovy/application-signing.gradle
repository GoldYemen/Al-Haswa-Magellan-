// Shared application identity and signing rules keep phone and Wear artifacts compatible with the
// Wear Data Layer, which requires both peers to use the same application ID and certificate.

def securityPropertiesFile = rootProject.file('app/secure.properties')
def securityPropertiesFileExists = securityPropertiesFile.exists() && securityPropertiesFile.length() > 0

def signingStoreFile = { String path ->
    def storeFile = new File(path)
    return storeFile.isAbsolute() ? storeFile : rootProject.file("app/${path}")
}

android {
    signingConfigs {
        debug {
            storeFile rootProject.file('app/debug.keystore')
            storePassword '12345678'
            keyAlias 'debug'
            keyPassword '12345678'
        }
        release {
            if (securityPropertiesFileExists) {
                println('The release signing keys are available')
                // Read secure.properties as a Java properties file; do not evaluate it as Groovy.
                def props = new Properties()
                securityPropertiesFile.withInputStream { props.load(it) }

                def findProp = { String... keys ->
                    for (k in keys) {
                        if (props.containsKey(k) && props.getProperty(k).toString().trim()) {
                            return props.getProperty(k).toString().trim()
                        }
                        for (entryKey in props.stringPropertyNames()) {
                            if (entryKey.equalsIgnoreCase(k) && props.getProperty(entryKey).toString().trim()) {
                                return props.getProperty(entryKey).toString().trim()
                            }
                        }
                    }
                    return null
                }

                def storeFileProp     = findProp('spropStoreFile','storeFile','keystore','keystoreFile','release.keystore','keystorePath')
                def storePasswordProp = findProp('spropStorePassword','storePassword','storepass','keystorePassword','keyStorePassword')
                def keyAliasProp      = findProp('spropKeyAlias','keyAlias','alias','keyAliasName')
                def keyPasswordProp   = findProp('spropKeyPassword','keyPassword','keypass','aliasPassword')

                if (storeFileProp && storePasswordProp && keyAliasProp && keyPasswordProp) {
                    def resolvedStore = signingStoreFile(storeFileProp)
                    if (!resolvedStore.exists()) {
                        println("WARNING: Keystore file not found: ${resolvedStore} — falling back to debug signing.")
                    } else {
                        storeFile      resolvedStore
                        storePassword  storePasswordProp
                        keyAlias       keyAliasProp
                        keyPassword    keyPasswordProp
                    }
                } else {
                    println('The release signing keys are unavailable or incomplete; using debug signing.')
                }
            } else {
                println('The release signing keys are unavailable; using debug signing.')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig = signingConfigs.debug
        }
        release {
            // When no valid keystore is configured, the release config is empty.
            // Fall back to debug signing so the APK can still be assembled.
            signingConfig = (signingConfigs.release.storeFile != null) ?
                signingConfigs.release : signingConfigs.debug
        }
        beta {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            signingConfig = (signingConfigs.release.storeFile != null) ?
                signingConfigs.release : signingConfigs.debug
        }
    }
}
