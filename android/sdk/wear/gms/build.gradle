plugins {
  id 'com.android.library'
}

apply plugin: 'org.jetbrains.kotlin.android'

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"

android {
  namespace = 'app.alhaswamagellan.sdk.wear.gms'
  project.ext.enableKotlin = true  // see app/build.gradle
}

dependencies {
  implementation project(':libs:wear-protocol-gms')
  implementation project(':sdk:wear:core')

  implementation libs.google.gms.wearable
}
