plugins {
    id 'com.android.application'
}

apply plugin: 'org.jetbrains.kotlin.android'

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"
apply from: "${rootProject.rootDir}/groovy/application-signing.gradle"

android {
    namespace 'app.alhaswamagellan.wear'
    project.ext.enableKotlin = true  // see app/build.gradle

    defaultConfig {
        applicationId rootProject.ext.appId
        // Keep the Wear artifact version code unique from the phone app while preserving
        // the same base Al-Haswa Magellan version code for Google Play multi-form-factor uploads.
        // Use Math.min with Long arithmetic then intValue() to prevent integer overflow.
        versionCode Math.min(rootProject.ext.versionCode * 10L + 1L, (long)Integer.MAX_VALUE).intValue()
        versionName rootProject.ext.versionName
        minSdk 26
    }

    flavorDimensions 'default'

    productFlavors {
        google {
            dimension 'default'
            versionName = android.defaultConfig.versionName + '-Google'
        }
    }
}

dependencies {
    implementation project(':libs:branding')
    implementation project(':libs:wear-protocol')
    implementation project(':libs:wear-protocol-gms')
    implementation libs.google.gms.wearable

    testImplementation libs.androidx.junit
    testImplementation libs.mockito.core
}
