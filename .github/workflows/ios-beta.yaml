name: iOS Beta
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - .github/**
      - '!.github/workflows/ios-beta.yaml'  # Run check on self change
      - '**/*_tests/**'
      - '**/CMakeLists.txt'
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - README.md
      - android/**
      - data/strings/**
      - docs/**
      - generator/**
      - packaging/**
      - platform/*_android*
      - platform/*_linux*
      - platform/*_mac*
      - platform/*qt*
      - platform/*_win*
      - qt*/**
      - skin_generator/**
      - tools/**
      - track_generator/**

jobs:
  ios-beta:
    name: Apple TestFlight
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      LANG: en_US.UTF-8  # Fastlane complains that the terminal is using ASCII.
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    environment: beta
    defaults:
      run:
        shell: bash
    steps:
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show current version of Xcode
        run: xcodebuild -version

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 100 # enough to get all commits for the current day

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(sysctl -n hw.logicalcpu) * 20))

      - name: Restore beta keys
        shell: bash
        run: |
          mkdir -p xcode/keys

          # Keep the checked-in private.h unless the secret decodes to valid base64 AND
          # contains the required defines. An unset secret expands to an empty string and
          # used to truncate private.h to 0 bytes, which broke the compile step.
          if [[ -n "$PRIVATE_H" ]]; then
            if echo "$PRIVATE_H" | base64 -d > private.h.candidate 2>/dev/null; then
              if grep -q '^#define METASERVER_URL ' private.h.candidate &&
                 grep -q '^#define DEFAULT_URLS_JSON ' private.h.candidate; then
                mv private.h.candidate private.h
                echo "Restored private.h from secret."
              else
                echo "PRIVATE_H secret missing required defines; keeping checked-in private.h"
                rm -f private.h.candidate
              fi
            else
              echo "PRIVATE_H is not valid base64; keeping checked-in private.h"
              rm -f private.h.candidate 2>/dev/null || true
            fi
          else
            echo "PRIVATE_H not set; keeping checked-in private.h"
          fi

          # Keys required to sign the build and upload it to TestFlight.
          # They cannot be skipped silently: without them fastlane cannot sign the build,
          # so collect everything that is missing and fail once with a clear message
          # instead of leaving empty placeholder files behind.
          MISSING=""

          if [[ -n "$APPSTORE_JSON" ]] &&
             echo "$APPSTORE_JSON" | base64 -d > xcode/keys/appstore.json.tmp 2>/dev/null &&
             python3 -c "import json; json.load(open('xcode/keys/appstore.json.tmp'))" 2>/dev/null; then
            mv xcode/keys/appstore.json.tmp xcode/keys/appstore.json
            echo "Restored appstore.json from secret."
          else
            rm -f xcode/keys/appstore.json.tmp
            MISSING="$MISSING APPSTORE_JSON"
          fi

          for entry in "CERTIFICATES_DEV_P12:CertificatesDev.p12" "CERTIFICATES_DISTR_P12:CertificatesDistr.p12"; do
            secret_name="${entry%%:*}"
            target_file="${entry##*:}"
            secret_value="${!secret_name}"
            if [[ -n "$secret_value" ]] &&
               echo "$secret_value" | base64 -d > "xcode/keys/${target_file}.tmp" 2>/dev/null &&
               [[ -s "xcode/keys/${target_file}.tmp" ]]; then
              mv "xcode/keys/${target_file}.tmp" "xcode/keys/${target_file}"
              echo "Restored ${target_file} from secret."
            else
              rm -f "xcode/keys/${target_file}.tmp"
              MISSING="$MISSING $secret_name"
            fi
          done

          if [[ -n "$MISSING" ]]; then
            echo "::error::Missing or invalid repository secrets required for the iOS beta upload:$MISSING - add them under Settings > Secrets and variables > Actions (environment 'beta'), then run this workflow again."
            exit 1
          fi
        env:
          PRIVATE_H: ${{ secrets.PRIVATE_H }}
          APPSTORE_JSON: ${{ secrets.APPSTORE_JSON }}
          CERTIFICATES_DEV_P12: ${{ secrets.CERTIFICATES_DEV_P12 }}
          CERTIFICATES_DISTR_P12: ${{ secrets.CERTIFICATES_DISTR_P12 }}

      - name: Compile and upload to TestFlight
        run: |
          echo "IOS_VERSION=$(../tools/unix/version.sh ios_version)-$(../tools/unix/version.sh ios_build)" >> "$GITHUB_ENV"
          ./fastlane.sh upload_testflight
        env:
          APPSTORE_CERTIFICATE_PASSWORD: '${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}'
        working-directory: xcode

      - name: Upload ipa and DSYMs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ipa and DSYM archive ${{ env.IOS_VERSION }}
          path: xcode/build/*
          if-no-files-found: error
