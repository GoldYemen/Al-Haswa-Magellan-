name: Android Monkey
on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron:  '0 5 * * 0' # Once per week at 05:00 UTC

env:
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64  # Java 17 is required for Android Gradle 8 plugin

jobs:
  precondition:
    runs-on: ubuntu-latest
    name: Check preconditions
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1000 # fetch month or so

      - name: Check that Android was updated
        id: check
        shell: bash
        run: |
          DIRS="android base drape drape_frontend editor ge0 map platform routing search shaders storage traffic transit"
          if [ '${{ github.event_name }}' != 'schedule' ] ||
             [ $(git rev-list --count --since="24 hours" HEAD $DIRS) -gt 0 ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=" >> $GITHUB_OUTPUT
          fi
    outputs:
      updated: ${{ steps.check.outputs.updated }}

  android-google-beta:
    name: Android Google Beta
    runs-on: ubuntu-latest
    needs: precondition
    if: ${{ needs.precondition.outputs.updated != '' }}
    environment: beta
    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Install Google SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 100 # enough to get all commits for the current day

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Restore beta keys
        shell: bash
        run: |
          # Remove stale decoded files from previous runs.
          rm -f android/app/firebase-test-lab.json
          rm -f android/app/firebase-app-distribution.json
          rm -f android/app/google-services.json
          rm -f android/app/secure.properties
          rm -f android/app/release.keystore

          # Keep the checked-in private.h unless the secret decodes to valid base64 AND
          # contains the required defines. An unset secret expands to an empty string and
          # used to truncate private.h to 0 bytes, which broke the compile step.
          if [[ -n "$PRIVATE_H" ]]; then
            if echo "$PRIVATE_H" | base64 -d > private.h.candidate 2>/dev/null; then
              if grep -q '^#define METASERVER_URL ' private.h.candidate &&
                 grep -q '^#define DEFAULT_URLS_JSON ' private.h.candidate; then
                mv private.h.candidate private.h
                echo "Restored private.h from secret."
              else
                echo "PRIVATE_H secret missing required defines; keeping checked-in private.h"
                rm -f private.h.candidate
              fi
            else
              echo "PRIVATE_H is not valid base64; keeping checked-in private.h"
              rm -f private.h.candidate 2>/dev/null || true
            fi
          else
            echo "PRIVATE_H not set; keeping checked-in private.h"
          fi

          # Write a JSON secret only when it decodes to valid JSON.
          # The Gradle google-services plugin is applied only when the file is valid.
          for entry in "FIREBASE_TEST_LAB_JSON:android/app/firebase-test-lab.json" "FIREBASE_APP_DISTRIBUTION_JSON:android/app/firebase-app-distribution.json" "GOOGLE_SERVICES_JSON:android/app/google-services.json"; do
            secret_name="${entry%%:*}"
            target_file="${entry##*:}"
            secret_value="${!secret_name}"
            if [[ -n "$secret_value" ]] &&
               echo "$secret_value" | base64 -d > "${target_file}.tmp" 2>/dev/null &&
               python3 -c "import json; json.load(open('${target_file}.tmp'))" 2>/dev/null; then
              mv "${target_file}.tmp" "$target_file"
              echo "Restored ${target_file##*/} from secret."
            else
              rm -f "${target_file}.tmp"
              echo "${secret_name} not set or invalid; ${target_file##*/} will be unavailable."
            fi
          done

          if [[ -s android/app/google-services.json ]]; then
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
          fi

          # Signing secrets are optional: fall back to debug signing when unavailable.
          for entry in "SECURE_PROPERTIES:android/app/secure.properties" "RELEASE_KEYSTORE:android/app/release.keystore"; do
            secret_name="${entry%%:*}"
            target_file="${entry##*:}"
            secret_value="${!secret_name}"
            if [[ -n "$secret_value" ]] &&
               echo "$secret_value" | base64 -d > "${target_file}.tmp" 2>/dev/null &&
               [[ -s "${target_file}.tmp" ]]; then
              mv "${target_file}.tmp" "$target_file"
              echo "Restored ${target_file##*/} from secret."
            else
              rm -f "${target_file}.tmp"
              echo "${secret_name} not set or invalid; falling back to debug signing."
            fi
          done
        env:
          PRIVATE_H: ${{ secrets.PRIVATE_H }}
          FIREBASE_TEST_LAB_JSON: ${{ secrets.FIREBASE_TEST_LAB_JSON }}
          FIREBASE_APP_DISTRIBUTION_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SECURE_PROPERTIES: ${{ secrets.SECURE_PROPERTIES }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Check required secrets
        shell: bash
        run: |
          MISSING=""
          [[ -s android/app/firebase-test-lab.json ]] || MISSING="$MISSING FIREBASE_TEST_LAB_JSON"
          [[ "$HAS_GOOGLE_SERVICES" == "true" ]] || MISSING="$MISSING GOOGLE_SERVICES_JSON"
          if [[ -n "$MISSING" ]]; then
            echo "::error::Missing or invalid repository secrets required for the monkey test:$MISSING - Firebase Test Lab cannot run without them. Add them under Settings > Secrets and variables > Actions (environment 'beta'), then run this workflow again."
            exit 1
          fi

      - name: Compile
        shell: bash
        working-directory: android
        run: |
          cmake --version
          ninja --version
          ./gradlew -Pfirebase -Parm64 -Parmeabi-v7a assembleGoogleBeta uploadCrashlyticsSymbolFileGoogleBeta uploadCrashlyticsMappingFileGoogleBeta

      - name: Run monkey
        run: |
          gcloud auth activate-service-account --key-file android/app/firebase-test-lab.json
          gcloud config set project omapsapp
          gcloud firebase test android run --app ./android/app/build/outputs/apk/google/beta/Al-HaswaMagellan-*-google-beta.apk \
            --device model=husky,version=34 \
            --device model=tangorpro,version=33,orientation=landscape \
            --device model=bluejay,version=32 \
            --device model=a51,version=31 \
            --device model=f2q,version=30,orientation=landscape \
            --device model=a10,version=29,orientation=landscape \
            --device model=cactus,version=27 \
            --device model=sailfish,version=25 \
            --device model=harpia,version=23 \
            --timeout 15m
