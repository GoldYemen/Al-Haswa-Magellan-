name: Code style check - Swift

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/code-style-check-swift.yaml'
      - 'iphone/.swift-version'
      - 'iphone/.swiftformat'
      - 'iphone/**.swift'

jobs:
  code-style-check-swift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Install swiftformat
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"  # Homebrew is not in PATH by default.
          brew install swiftformat
          swiftformat --version

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Run swiftformat
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"  # Homebrew is not in PATH by default.
          swiftformat iphone
          git diff --exit-code  # swiftformat reformats in place and always exits 0.

      - name: Post swiftformat comments
        if: failure()
        uses: reviewdog/action-suggester@ac5ce6d94e35c00530447dc63c271e38e4fd36c6 # v1.26.3
        with:
          fail_level: error
          tool_name: swiftformat
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEWDOG_TOKEN }}
