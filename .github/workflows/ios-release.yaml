name: iOS Release
on:
  workflow_dispatch: # Manual trigger

jobs:
  ios-release:
    name: iOS Release
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      LANG: en_US.UTF-8  # Fastlane complains that the terminal is using ASCII.
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore release keys
        shell: bash
        run: |
          mkdir -p xcode/keys

          # appstore.json is required to upload metadata, screenshots and builds.
          # An unset secret expands to an empty string, which used to leave an empty
          # placeholder file behind and fail later with a confusing error. Validate the
          # secret and fail early with a clear message instead.
          if [[ -n "$APPSTORE_JSON" ]] &&
             echo "$APPSTORE_JSON" | base64 -d > xcode/keys/appstore.json.tmp 2>/dev/null &&
             python3 -c "import json; json.load(open('xcode/keys/appstore.json.tmp'))" 2>/dev/null; then
            mv xcode/keys/appstore.json.tmp xcode/keys/appstore.json
            echo "Restored appstore.json from secret."
          else
            rm -f xcode/keys/appstore.json.tmp
            echo "::error::Missing or invalid secret APPSTORE_JSON - add it under Settings > Secrets and variables > Actions (environment 'production'), then run this workflow again."
            exit 1
          fi
        env:
          APPSTORE_JSON: ${{ secrets.APPSTORE_JSON }}

      - name: Checkout screenshots
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SCREENSHOTS_REPO }}
          ssh-key: ${{ secrets.SCREENSHOTS_SSH_KEY }}
          ref: main
          path: screenshots

      - name: Checkout keywords
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.KEYWORDS_REPO }}
          ssh-key: ${{ secrets.KEYWORDS_SSH_KEY }}
          ref: main
          path: keywords

      - name: Update metadata
        shell: bash
        run: ./tools/python/check_store_metadata.py ios

      # NOTE: a new iOS draft must be created before this step
      - name: Upload metadata
        shell: bash
        run: ./fastlane.sh upload_metadata
        working-directory: xcode
        timeout-minutes: 5

      - name: Upload screenshots
        shell: bash
        run: ./fastlane.sh upload_screenshots
        working-directory: xcode
        timeout-minutes: 10
