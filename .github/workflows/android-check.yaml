name: Android Check
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - .gitignore
      - .github/**
      - '!.github/workflows/android-check.yaml'  # Run check on self change
      - '**/*_tests/**'
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - README.md
      - android/app/src/fdroid/**
      - android/app/src/google/**
      - iphone/**
      - data/organic_maps_emoji/**
      - data/strings/**
      - docs/**
      - generator/**
      - packaging/**
      - platform/*apple*
      - platform/*_ios*
      - platform/*_linux*
      - platform/*_mac*
      - platform/*qt*
      - platform/*_win*
      - qt*/**
      - skin_generator/**
      - tools/**
      - track_generator/**
      - xcode/**

env:
  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64  # Java 21 is required for AGP 9.x

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Lint
        shell: bash
        working-directory: android
        run: ./gradlew lintAllModules

      # Reviewdog is needed for the action below to report issues in the PR.
      - name: Install reviewdog
        uses: reviewdog/action-setup@v1

      - name: Report Android Lint Results
        uses: ilyagulya/android-lint-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_xml_file: android/build/reports/lint/lint.xml
          reporter: github-pr-review
          level: warning

      - name: Upload Android Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/build/reports/lint/lint.xml
          retention-days: 30

  android-check:
    name: Build Android Debug
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [WebDebug, FdroidDebug]
        include:
          - flavor: WebDebug
            arch: arm64
            run-tests: true
          - flavor: FdroidDebug
            arch: arm32
    # Cancels previous jobs if the same branch or PR was updated again.
    # Only cancel PR runs: main runs must finish to populate the shared ccache.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.flavor }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Needed for versioning script
          fetch-depth: 200 # enough to get all commits for the current day

      - name: Fetch submodules manually
        shell: bash
        run: |
          echo "Fetching submodules manually (GitHub fork did not preserve submodule refs)..."
          for d in 3party/BLAKE3 3party/CMake-MetalShaderSupport 3party/Vulkan-Headers 3party/boost_headers 3party/expat 3party/fast_float 3party/fast_obj 3party/gflags 3party/glaze 3party/glfw 3party/glm 3party/googletest 3party/minizip-ng 3party/utfcpp 3party/zlib-ng 3party/freetype/freetype 3party/harfbuzz/harfbuzz 3party/icu/icu 3party/imgui/imgui 3party/pugixml/pugixml tools/kothic tools/osmctools tools/python/twine; do
            rm -rf "$d" 2>/dev/null || true
          done
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3 3party/BLAKE3
          git clone --depth 1 --branch main https://github.com/dpogue/CMake-MetalShaderSupport.git 3party/CMake-MetalShaderSupport
          git clone --depth 1 --branch main https://github.com/KhronosGroup/Vulkan-Headers.git 3party/Vulkan-Headers
          git clone --depth 1 --branch master https://github.com/organicmaps/boost_headers.git 3party/boost_headers
          git clone --depth 1 --branch R_2_8_2 https://github.com/libexpat/libexpat.git 3party/expat
          git clone --depth 1 --branch main https://github.com/fastfloat/fast_float.git 3party/fast_float
          git clone --depth 1 --branch master https://github.com/thisistherk/fast_obj 3party/fast_obj
          git clone --depth 1 --branch main https://github.com/gflags/gflags 3party/gflags
          git clone --depth 1 --branch main https://github.com/stephenberry/glaze 3party/glaze
          git clone --depth 1 --branch master https://github.com/glfw/glfw.git 3party/glfw
          git clone --depth 1 --branch master https://github.com/g-truc/glm.git 3party/glm
          git clone --depth 1 --branch main https://github.com/google/googletest.git 3party/googletest
          git clone --depth 1 --branch 4.2.2 https://github.com/zlib-ng/minizip-ng.git 3party/minizip-ng
          git clone --depth 1 --branch master https://github.com/nemtrif/utfcpp.git 3party/utfcpp
          git clone --depth 1 --branch 2.3.3 https://github.com/zlib-ng/zlib-ng.git 3party/zlib-ng
          git clone --depth 1 --branch master https://github.com/organicmaps/freetype.git 3party/freetype/freetype
          git clone --depth 1 --branch main https://github.com/harfbuzz/harfbuzz.git 3party/harfbuzz/harfbuzz
          git clone --depth 1 --branch main https://github.com/unicode-org/icu.git 3party/icu/icu
          git clone --depth 1 --branch master https://github.com/ocornut/imgui 3party/imgui/imgui
          git clone --depth 1 --branch master https://github.com/zeux/pugixml.git 3party/pugixml/pugixml
          git clone --depth 1 --branch master https://github.com/organicmaps/kothic.git tools/kothic
          git clone --depth 1 --branch master https://github.com/organicmaps/osmctools.git tools/osmctools
          git clone --depth 1 --branch organicmaps https://github.com/organicmaps/twine.git tools/python/twine
          echo "All submodules fetched successfully."

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.workflow }}-${{ matrix.flavor }}
          # Restore-only on PRs: main populates the shared cache, PRs read it.
          # Avoids overflowing the 10GB repo limit, which evicts main's caches.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile ${{ matrix.flavor }}
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --version
          ninja --version
          ./gradlew -P${{ matrix.arch }} assemble${{ matrix.flavor }}

      - name: Compile Wear Google Debug
        if: matrix.flavor == 'WebDebug'
        shell: bash
        working-directory: android
        run: ./gradlew :wear:assembleGoogleDebug

      - name: Free disk space for emulator
        if: matrix.run-tests == true
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null

      - name: Enable KVM
        if: matrix.run-tests == true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests
        if: matrix.run-tests == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: ./android
          script: >-
            ./gradlew -P${{ matrix.arch }} app:test${{ matrix.flavor }} sdk:testDebug
            :wear:testGoogleDebugUnitTest :libs:wear-protocol-gms:testDebugUnitTest
            :sdk:wear:core:testDebugUnitTest sdk:connectedDebugAndroidTest

      - name: Upload ${{ matrix.flavor }} apk
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
