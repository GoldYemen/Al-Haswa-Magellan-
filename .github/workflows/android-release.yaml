name: Android Release
on:
  workflow_dispatch:
    inputs:
      fdroid:
        description: 'Push F-Droid bump commit to branch'
        type: boolean
        default: true
      google:
        description: 'Build & publish Google Play'
        type: boolean
        default: true
      huawei:
        description: 'Build & publish Huawei AppGallery'
        type: boolean
        default: true
      web:
        description: 'Build web APK & create GitHub Release'
        type: boolean
        default: true

env:
  RELEASE_NOTES: android/app/src/google/play/release-notes/en-US/default.txt
  FDROID_VERSION: android/app/src/fdroid/play/version.yaml
  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64  # Java 21 is required for AGP 9.x

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - id: compute
        shell: bash
        run: |
          flavors=()
          [[ "${{ inputs.google }}" == "true" ]] && flavors+=('{"flavor":"google"}')
          [[ "${{ inputs.huawei }}" == "true" ]] && flavors+=('{"flavor":"huawei"}')
          [[ "${{ inputs.web }}"    == "true" ]] && flavors+=('{"flavor":"web"}')
          (IFS=,; echo "matrix=[${flavors[*]}]" >> $GITHUB_OUTPUT)

  tag:
    name: Tag
    if: inputs.fdroid || inputs.google || inputs.huawei || inputs.web
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}
          persist-credentials: true

      - name: Tag
        id: tag
        shell: bash
        run: |
          set -x
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor }}@users.noreply.github.com'
          branch="${GITHUB_REF#refs/heads/}"
          test -n "$branch"
          # When releasing F-Droid, create the bump commit first, read version.sh
          # from the new HEAD, then amend FDROID_VERSION in. Predicting the
          # post-bump version with "+1" breaks across UTC midnight (version.sh
          # groups commits by UTC day).
          if [[ "${{ inputs.fdroid }}" == "true" ]]; then
            git commit --allow-empty -m "Bump versions" -s
          fi
          version=$(tools/unix/version.sh ios_version)
          build=$(tools/unix/version.sh count)
          code=$(tools/unix/version.sh android_code)
          tag=$version-$build-android
          if [[ "${{ inputs.fdroid }}" == "true" ]]; then
            echo "version: ${version}-${build}-FDroid+${code}" > ${{ env.FDROID_VERSION }}
            git add ${{ env.FDROID_VERSION }}
            # Preserve the original committer-date so version.sh post-amend
            # still returns the values we just wrote, even if the amend crosses
            # midnight UTC.
            orig_date=$(git log -1 --pretty=format:%cI)
            GIT_COMMITTER_DATE="$orig_date" git commit --amend --no-edit -s
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build=$build" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "code=$code" >> $GITHUB_OUTPUT
          {
            echo $tag
            echo
            cat ${{ env.RELEASE_NOTES }}
          } > ${{ runner.temp }}/tag.txt
          git tag -a $tag -F ${{ runner.temp }}/tag.txt
          git show $tag
          if [[ "${{ inputs.fdroid }}" == "true" ]]; then
            git push origin $branch:$branch
          fi
          git push origin $tag:$tag
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      code: ${{ steps.tag.outputs.code }}
      tag: ${{ steps.tag.outputs.tag }}

  android-release:
    name: Android Release
    runs-on: ubuntu-latest
    environment: production
    env:
      # Secrets cannot be referenced inside an `if:` expression directly, so they
      # are exposed as job-level variables and the conditions below read those.
      SCREENSHOTS_REPO: ${{ secrets.SCREENSHOTS_REPO }}
    permissions:
      contents: write
      discussions: write
    needs: [setup, tag]
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          ref: 'refs/tags/${{ needs.tag.outputs.tag }}'

      - name: Check tag
        shell: bash
        run: |
          git show HEAD
          test -n "${{ needs.tag.outputs.tag }}"
          test "$(git tag --points-at HEAD)" = "${{ needs.tag.outputs.tag }}"

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Checkout screenshots
        # Optional: skipped when no screenshots repository is configured. The
        # release build must not fail just because this extra repo is absent.
        if: ${{ env.SCREENSHOTS_REPO != '' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SCREENSHOTS_REPO }}
          ssh-key: ${{ secrets.SCREENSHOTS_SSH_KEY }}
          ref: main
          path: screenshots

      - name: Restore release keys
        shell: bash
        run: |
          # A secret that is not configured expands to an empty string, and
          # `echo "" | base64 -d > file` silently truncates the file to 0 bytes.
          # private.h must never end up empty: it is part of the native build
          # (libs/platform/CMakeLists.txt, android/sdk/.../CMakeLists.txt) and is
          # #included by platform.cpp, osm_auth.cpp, traffic_info.cpp and more,
          # so an empty file fails to compile with "'METASERVER_URL' was not
          # declared in this scope" and friends.
          #
          # Rule for every file below: decode to a temporary file first, keep the
          # file that is already in the repository when the secret is missing or
          # does not decode, and only move the temporary file into place when it
          # is valid.
          rm -f private.h.candidate

          # ── PRIVATE_H ──
          if [[ -n "$PRIVATE_H" ]]; then
            if echo "$PRIVATE_H" | base64 -d > private.h.candidate 2>/dev/null; then
              if grep -q '^#define METASERVER_URL ' private.h.candidate && \
                 grep -q '^#define DEFAULT_URLS_JSON ' private.h.candidate; then
                mv private.h.candidate private.h
                echo "Restored private.h from the PRIVATE_H secret."
              else
                echo "PRIVATE_H is missing the required defines; keeping the checked-in private.h."
                rm -f private.h.candidate
              fi
            else
              echo "PRIVATE_H is not valid base64; keeping the checked-in private.h."
              rm -f private.h.candidate 2>/dev/null || true
            fi
          else
            echo "PRIVATE_H not set; keeping the checked-in private.h."
          fi

          # Hard stop instead of letting the native build fail 4 minutes later.
          if [[ ! -s private.h ]]; then
            echo "::error::private.h is empty, the native build cannot continue."
            exit 1
          fi
          echo "private.h is $(wc -c < private.h) bytes."

          # ── GOOGLE_PLAY_JSON ──
          if [[ -n "$GOOGLE_PLAY_JSON" ]]; then
            echo "$GOOGLE_PLAY_JSON" | base64 -d > android/app/google-play.json.tmp 2>/dev/null
            if [[ -s android/app/google-play.json.tmp ]]; then
              mv android/app/google-play.json.tmp android/app/google-play.json
              echo "HAS_GOOGLE_PLAY=true" >> "$GITHUB_ENV"
            else
              echo "GOOGLE_PLAY_JSON decoded to an empty file; Play publishing stays disabled."
              rm -f android/app/google-play.json.tmp
              echo "HAS_GOOGLE_PLAY=false" >> "$GITHUB_ENV"
            fi
          else
            echo "GOOGLE_PLAY_JSON not set; Play publishing stays disabled."
            echo "HAS_GOOGLE_PLAY=false" >> "$GITHUB_ENV"
          fi

          # ── HUAWEI_APPGALLERY_JSON / AGCONNECT_SERVICES_JSON ──
          if [[ -n "$HUAWEI_APPGALLERY_JSON" ]]; then
            echo "$HUAWEI_APPGALLERY_JSON" | base64 -d > android/app/huawei-appgallery.json.tmp 2>/dev/null
            if [[ -s android/app/huawei-appgallery.json.tmp ]]; then
              mv android/app/huawei-appgallery.json.tmp android/app/huawei-appgallery.json
              echo "HAS_HUAWEI_APPGALLERY=true" >> "$GITHUB_ENV"
            else
              echo "HUAWEI_APPGALLERY_JSON decoded to an empty file; AppGallery publishing stays disabled."
              rm -f android/app/huawei-appgallery.json.tmp
              echo "HAS_HUAWEI_APPGALLERY=false" >> "$GITHUB_ENV"
            fi
          else
            echo "HUAWEI_APPGALLERY_JSON not set; AppGallery publishing stays disabled."
            echo "HAS_HUAWEI_APPGALLERY=false" >> "$GITHUB_ENV"
          fi

          if [[ -n "$AGCONNECT_SERVICES_JSON" ]]; then
            echo "$AGCONNECT_SERVICES_JSON" | base64 -d > android/app/agconnect-services.json.tmp 2>/dev/null
            if [[ -s android/app/agconnect-services.json.tmp ]]; then
              mv android/app/agconnect-services.json.tmp android/app/agconnect-services.json
              echo "Restored agconnect-services.json from the secret."
            else
              echo "AGCONNECT_SERVICES_JSON decoded to an empty file; keeping the build without it."
              rm -f android/app/agconnect-services.json.tmp
            fi
          else
            echo "AGCONNECT_SERVICES_JSON not set; keeping the build without it."
          fi

          # ── SECURE_PROPERTIES ──
          # Without it groovy/application-signing.gradle falls back to debug
          # signing, which is a supported configuration.
          if [[ -n "$SECURE_PROPERTIES" ]]; then
            echo "$SECURE_PROPERTIES" | base64 -d > android/app/secure.properties.tmp 2>/dev/null
            if [[ -s android/app/secure.properties.tmp ]]; then
              mv android/app/secure.properties.tmp android/app/secure.properties
              echo "Restored secure.properties from the secret."
            else
              echo "SECURE_PROPERTIES decoded to an empty file; the release will be debug-signed."
              rm -f android/app/secure.properties.tmp
            fi
          else
            echo "SECURE_PROPERTIES not set; the release will be debug-signed."
          fi

          # ── RELEASE_KEYSTORE ──
          # Only moved into place when secure.properties actually points at it.
          if [[ -n "$RELEASE_KEYSTORE" ]]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore.tmp 2>/dev/null
            if [[ -s android/app/release.keystore.tmp ]]; then
              mv android/app/release.keystore.tmp android/app/release.keystore
              echo "Restored release.keystore from the secret."
            else
              echo "RELEASE_KEYSTORE decoded to an empty file; using the debug keystore."
              rm -f android/app/release.keystore.tmp
            fi
          else
            echo "RELEASE_KEYSTORE not set; using the debug keystore."
          fi
        env:
          PRIVATE_H: ${{ secrets.PRIVATE_H }}
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
          HUAWEI_APPGALLERY_JSON: ${{ secrets.HUAWEI_APPGALLERY_JSON }}
          AGCONNECT_SERVICES_JSON: ${{ secrets.AGCONNECT_SERVICES_JSON }}
          SECURE_PROPERTIES: ${{ secrets.SECURE_PROPERTIES }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Set up SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Compile steps are separated from upload steps to save built artifacts and debug symbols inbetween.
      - name: Compile for Google Play
        if: ${{ matrix.flavor == 'google' }}
        shell: bash
        working-directory: android
        run: ./gradlew bundleGoogleRelease

      - name: Compile for Huawei AppGallery
        if: ${{ matrix.flavor == 'huawei' }}
        shell: bash
        working-directory: android
        run: ./gradlew bundleHuaweiRelease

      - name: Compile universal web APK
        if: ${{ matrix.flavor == 'web' }}
        shell: bash
        working-directory: android
        run: ./gradlew assembleWebRelease

      - name: Upload web debug symbols to GitHub artifacts # Google and Huawei include debug symbols inside the aab.
        if: ${{ matrix.flavor == 'web' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-symbols-web.zip
          path: android/app/build/outputs/native-debug-symbols/webRelease/native-debug-symbols.zip

      - name: Upload Google aab to GitHub artifacts
        if: ${{ matrix.flavor == 'google' }}
        uses: actions/upload-artifact@v7
        with:
          name: AlHaswaMagellan-${{ needs.tag.outputs.code }}-google-release.aab
          path: ./android/app/build/outputs/bundle/googleRelease/AlHaswaMagellan-${{ needs.tag.outputs.code }}-google-release.aab

      - name: Upload Huawei aab to GitHub artifacts
        if: ${{ matrix.flavor == 'huawei' }}
        uses: actions/upload-artifact@v7
        with:
          name: AlHaswaMagellan-${{ needs.tag.outputs.code }}-huawei-release.aab
          path: ./android/app/build/outputs/bundle/huaweiRelease/AlHaswaMagellan-${{ needs.tag.outputs.code }}-huawei-release.aab

      # Store publishing is disabled on purpose: the Google Play publisher
      # (com.github.triplet.play) and the Huawei AppGallery publisher
      # (ru.cian.huawei-publish-gradle-plugin) are not applied in
      # android/app/build.gradle, so `publishGoogleReleaseBundle` and
      # `publishHuaweiAppGalleryHuaweiRelease` do not exist and would fail the
      # build. The signed .aab files are still uploaded as workflow artifacts
      # above and can be uploaded to the stores by hand.
      #
      # Re-enable these two steps once the publisher plugins are added back and
      # the matching store credentials are configured as secrets.
      #
      #- name: Upload to Google Play
      #  if: ${{ matrix.flavor == 'google' && env.HAS_GOOGLE_PLAY == 'true' }}
      #  shell: bash
      #  working-directory: android
      #  run: ./gradlew publishGoogleReleaseBundle
      #
      #- name: Upload to Huawei AppGallery
      #  if: ${{ matrix.flavor == 'huawei' && env.HAS_HUAWEI_APPGALLERY == 'true' }}
      #  shell: bash
      #  working-directory: android
      #  run: ./gradlew publishHuaweiAppGalleryHuaweiRelease

      - name: sha256sum web release apk
        if: ${{ matrix.flavor == 'web' }}
        shell: bash
        working-directory: android/app/build/outputs/apk/web/release
        run: sha256sum AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.apk > AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.apk.sha256sum

      - name: Upload web release apk and its sha256sum to GitHub artifacts
        if: ${{ matrix.flavor == 'web' }}
        uses: actions/upload-artifact@v7
        with:
          name: AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.apk
          path: ./android/app/build/outputs/apk/web/release/AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.*

      - name: Prepare release notes
        if: ${{ matrix.flavor == 'web' }}
        shell: bash
        run: |
          {
            cat ${{ env.RELEASE_NOTES }}
            echo ""
            echo "See [a detailed announce](https://organicmaps.app/news/) on our website when app updates are published in all stores."
            echo "You can get automatic app updates from GitHub [using Obtainium](https://github.com/organicmaps/organicmaps/wiki/Installing-Organic-Maps-from-GitHub-using-Obtainium)."
            echo ""
            echo "sha256sum:"
            echo -e '\n```'
            tr -d '\n' < ./android/app/build/outputs/apk/web/release/AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.apk.sha256sum
            echo -e '\n```'
          } > ${{ runner.temp }}/release-notes.txt

      - name: Upload universal APK to GitHub
        if: ${{ matrix.flavor == 'web' }}
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.tag.outputs.tag }}
          tag_name: ${{ needs.tag.outputs.tag }}
          discussion_category_name: 'Announcements'
          files: |
            ./android/app/build/outputs/apk/web/release/AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.apk
            ./android/app/build/outputs/apk/web/release/AlHaswaMagellan-${{ needs.tag.outputs.code }}-web-release.apk.sha256sum
          fail_on_unmatched_files: true
